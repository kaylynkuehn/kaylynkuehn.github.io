const $=s=>document.querySelector(s);
const state={brand:'All',purpose:'All',condition:'All',rx:false,st:false,q:'',sort:'mix'};
let STARS=new Set();try{STARS=new Set(JSON.parse(localStorage.getItem('inspo_stars')||'[]'))}catch(e){}
let starRef=null,saveT=null;
function saveStars(){try{localStorage.setItem('inspo_stars',JSON.stringify([...STARS]))}catch(e){}clearTimeout(saveT);saveT=setTimeout(()=>{if(starRef)starRef.set({ids:[...STARS]}).catch(()=>{})},500);}
function toggleStar(id){STARS.has(id)?STARS.delete(id):STARS.add(id);saveStars();$('#stn').textContent='('+STARS.size+')';if(state.st)render();else document.querySelectorAll('[data-star="'+id+'"]').forEach(b=>b.setAttribute('aria-pressed',STARS.has(id)));}
const fmt=d=>new Date(d).toLocaleDateString('en-US',{day:'numeric',month:'short',year:'numeric'});
const when=r=>r.deck?'2024 inspo deck':(r.src==='milled'&&!r.date)?'Milled archive':fmt(r.date);
function facet(key,label){
  const el=$('#f-'+key);const counts={};DATA.forEach(r=>[].concat(r[key]).forEach(v=>counts[v]=(counts[v]||0)+1));
  const vals=['All',...Object.keys(counts).sort((a,b)=>a.localeCompare(b,undefined,{sensitivity:'base'}))];
  el.innerHTML=vals.map(v=>'<option value="'+v.replace(/"/g,'&quot;')+'">'+(v==='All'?label:v)+' ('+(v==='All'?(vals.length-1):counts[v])+')</option>').join('');
  el.value=state[key];el.classList.toggle('on',state[key]!=='All');
  el.onchange=()=>{state[key]=el.value;el.classList.toggle('on',el.value!=='All');syncClear();render();};
}
function syncClear(){$('#clear').hidden=!state.rx&&!state.st&&['brand','purpose','condition'].every(k=>state[k]==='All');}
function hash(str){let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const SEED=Math.floor(Date.now()/864e5);
function mix(rows){
  const clin=/before|after|result|derm|tretinoin|retin|prescri|spironolactone|azelaic|hydroquinone|melasma|acne|clinical|provider/i;
  const score=r=>(r.animated?1:0)+(clin.test(r.subject+' '+r.notes)?2:0)+(/educat|launch|welcome|onboard/i.test(r.purpose)?1:0)+(hash(r.id+SEED)%1000)/700;
  const rr=list=>{const by={};list.forEach(r=>(by[r.brand]=by[r.brand]||[]).push(r));const ls=Object.keys(by).sort((a,b)=>hash(a+SEED)-hash(b+SEED)).map(k=>by[k].sort((a,b)=>score(b)-score(a)));const o=[];let i=0;while(o.length<list.length){ls.forEach(l=>{if(i<l.length)o.push(l[i])});i++;}return o;};
  const C=rr(rows.filter(r=>r.rx&&!r.lo)),F=rr(rows.filter(r=>!r.rx&&!r.lo&&r.fav)).sort((a,b)=>(b.top?1:0)-(a.top?1:0)),N=rr(rows.filter(r=>!r.rx&&!r.lo&&!r.fav)),L=rr(rows.filter(r=>r.lo));
  const O=[];while(F.length||N.length){O.push(...F.splice(0,2));O.push(...N.splice(0,1));}
  const out=[];let k=0;while(C.length||O.length){const takeO=k>=3&&(k-3)%3===2;out.push(...((takeO&&O.length)||!C.length?O.splice(0,1):C.splice(0,1)));k++;}
  const start=Math.floor(out.length*0.55),gap=Math.max(1,Math.floor((out.length-start)/Math.max(1,L.length)));
  L.forEach((r,n)=>out.splice(Math.min(out.length,start+n*(gap+1)),0,r));return out;}
function render(){
  const q=state.q.toLowerCase();
  let rows=DATA.filter(r=>(!state.rx||r.rx)&&(!state.st||STARS.has(r.id))&&(state.brand==='All'||r.brand===state.brand)&&(state.purpose==='All'||r.purpose===state.purpose)&&(state.condition==='All'||r.condition.includes(state.condition))
    &&(!q||(r.subject+' '+r.preheader+' '+r.notes+' '+r.brand+' '+r.condition.join(' ')).toLowerCase().includes(q)));
  if(state.sort==='mix'){rows=mix(rows);}else rows.sort(state.sort==='old'?(a,b)=>a.date.localeCompare(b.date):state.sort==='brand'?(a,b)=>a.brand.localeCompare(b.brand)||b.date.localeCompare(a.date):(a,b)=>b.date.localeCompare(a.date));
  $('#count').textContent=rows.length+' sends';
  const g=$('#grid');g.innerHTML='';
  if(!rows.length){g.innerHTML='<div class="empty">'+(state.st&&!STARS.size?'No stars yet. Tap the star on any tile to save it here.':'No emails match. Clear the search or pick another brand.')+'</div>';return;}
  rows.forEach(r=>{const b=document.createElement('button');b.className='tile';b.type='button';
    b.innerHTML='<div class="thumb"><img loading="lazy" alt=""></div><div class="subj"></div><div class="meta"></div>';
    b.querySelector('img').src=r.thumb;
    if(r.rx){const x=document.createElement('span');x.className='rxtag';x.textContent='Rx';b.querySelector('.thumb').appendChild(x);}
    if(r.animated){const s=document.createElement('span');s.className='anim';s.textContent='Animated';b.querySelector('.thumb').appendChild(s);}
    b.querySelector('.subj').textContent=r.subject;b.querySelector('.meta').textContent=r.brand+' · '+r.condition.join(', ')+' · '+when(r);
    b.onclick=()=>open(r);const c=document.createElement('div');c.className='cell';c.appendChild(b);const s=document.createElement('button');s.type='button';s.className='star';s.dataset.star=r.id;s.setAttribute('aria-pressed',STARS.has(r.id));s.setAttribute('aria-label','Star '+r.subject);s.onclick=e=>{e.stopPropagation();toggleStar(r.id);};c.appendChild(s);g.appendChild(c);});
}
function open(r){$('#rb').textContent=r.brand;$('#rp').textContent=r.purpose+' · '+r.condition.join(', ');$('#rd').textContent=when(r)+'';
  $('#rt').textContent=r.subject;$('#rpre').textContent=r.preheader||(r.deck||r.src||r.id.startsWith('fob_pf')?'Preheader not captured':'(no preheader)');$('#rn').textContent=r.notes;
  const rs=$('#rs');rs.dataset.star=r.id;rs.setAttribute('aria-pressed',STARS.has(r.id));rs.onclick=()=>toggleStar(r.id);$('#rf').src=r.img;$('#rf').alt=r.subject;document.querySelector('.scroll').scrollTop=0;$('#reader').hidden=false;$('#rc').focus();}
function close(){$('#reader').hidden=true;$('#rf').removeAttribute('src');}
$('#rc').onclick=close;$('#shade').onclick=close;addEventListener('keydown',e=>{if(e.key==='Escape')close();});
$('#q').oninput=e=>{state.q=e.target.value;render();};
$('#sort').onchange=e=>{state.sort=e.target.value;render();};
$('#size').onchange=e=>{document.documentElement.style.setProperty('--tw',e.target.value+'px');};
const FL=[['brand','All brands'],['purpose','Any purpose'],['condition','Any condition']];FL.forEach(([k,l])=>facet(k,l));$('#rxn').textContent='('+DATA.filter(r=>r.rx).length+')';$('#rx').onclick=()=>{state.rx=!state.rx;$('#rx').setAttribute('aria-pressed',state.rx);syncClear();render();};
$('#stn').textContent='('+STARS.size+')';$('#st').onclick=()=>{state.st=!state.st;$('#st').setAttribute('aria-pressed',state.st);syncClear();render();};
$('#clear').onclick=()=>{state.rx=false;state.st=false;$('#st').setAttribute('aria-pressed','false');$('#rx').setAttribute('aria-pressed','false');FL.forEach(([k,l])=>{state[k]='All';facet(k,l);});syncClear();render();};render();
(async()=>{try{if(!window.claude||!claude.use)return;const db=await claude.use('db');const user=await claude.use('user');if(!db||!user)return;const uid=await user.id();if(!uid)return;starRef=db.doc('data/users/'+uid+'/stars');starRef.onSnapshot(snap=>{if(snap.metadata.hasPendingWrites)return;const ids=snap.exists?(snap.data().ids||[]):null;if(!ids){if(STARS.size)saveStars();return;}STARS=new Set(ids);try{localStorage.setItem('inspo_stars',JSON.stringify(ids))}catch(e){}$('#stn').textContent='('+STARS.size+')';render();},()=>{});}catch(e){}})();
function deep(){const id=decodeURIComponent(location.hash.slice(1));if(!id)return;const r=DATA.find(x=>x.id===id);if(r)open(r);}deep();addEventListener('hashchange',deep);
</script>
