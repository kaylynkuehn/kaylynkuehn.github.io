/* Layout: one pair per screen. Context strip, question, two side-by-side copy specimens rendered as they'd appear (inbox row, hero, body, mini email, button), then the pick bar. Committed dark look in MaleMD's own black/red/white. */
:root{
  color-scheme:dark;
  --bg:#0D0D0D; --panel:#171616; --raise:#201f1f; --ink:#F4F2F0; --mute:#9B9794; --rule:#2E2C2B;

  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:16px/1.5 var(--body);margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px;display:grid;gap:24px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--rule);padding-bottom:14px}
.logo{font:800 20px/1 var(--display);font-stretch:80%;letter-spacing:.02em;text-transform:uppercase}
.logo b{color:var(--red)}
.prog{font:500 12px var(--mono);color:var(--mute);font-variant-numeric:tabular-nums;display:flex;gap:10px;align-items:center}
.bar{width:120px;height:3px;background:var(--rule);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);width:0;transition:width .3s}
h1{font:800 clamp(38px,7vw,76px)/.92 var(--display);font-stretch:70%;text-transform:uppercase;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 em{font-style:normal;color:var(--red)}
h2{font:800 clamp(28px,4.4vw,44px)/1 var(--display);font-stretch:72%;text-transform:uppercase;margin:0;text-wrap:balance}
.lede{color:var(--mute);max-width:62ch;margin:0;font-size:17px}
.eyebrow{font:500 11px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.eyebrow b{color:var(--red);font-weight:500}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:0;padding:0;list-style:none}
.how li{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:16px;display:grid;gap:6px;min-width:0}
.how b{font:700 15px var(--body)}
.how span{color:var(--mute);font-size:14px}
.q{display:grid;gap:8px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.pair{grid-template-columns:1fr}}
.opt{all:unset;cursor:pointer;display:grid;gap:12px;align-content:start;background:var(--panel);border:2px solid var(--rule);border-radius:8px;padding:16px;min-width:0;transition:border-color .15s,transform .15s}
.opt:hover{border-color:#4a4644}
.opt:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.opt[aria-pressed="true"]{border-color:var(--red)}
.opt .lab{display:flex;justify-content:space-between;align-items:center;font:500 12px var(--mono);color:var(--mute)}
.opt .lab .chk{width:20px;height:20px;border-radius:50%;border:2px solid var(--rule);display:grid;place-items:center;font-size:12px;color:transparent}
.opt[aria-pressed="true"] .lab .chk{background:var(--red);border-color:var(--red);color:#fff}
.opt[aria-pressed="true"] .lab{color:var(--ink)}
/* specimens */
.spec{background:var(--paper);color:var(--paperink);border-radius:4px;overflow:hidden;min-width:0}
.inbox{display:grid;grid-template-columns:36px 1fr;gap:10px;padding:14px}
.av{width:36px;height:36px;border-radius:50%;background:#0D0D0D;color:#fff;display:grid;place-items:center;font:800 13px var(--display);font-stretch:80%}

textarea,input[type=text]{width:100%;background:var(--panel);border:1px solid var(--rule);color:var(--ink);font:15px/1.45 var(--body);padding:10px 12px;border-radius:6px;resize:vertical}

.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:18px}
.go{all:unset;cursor:pointer;background:var(--red);color:var(--redink);font:700 14px var(--body);letter-spacing:.05em;text-transform:uppercase;padding:13px 22px;border-radius:4px}

.sum{display:grid;gap:8px}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--rule);min-width:0}
.row .n{font:500 12px var(--mono);color:var(--mute);font-variant-numeric:tabular-nums}
.row .t{min-width:0}
.row .t small{display:block;color:var(--mute);font-size:13px}
.row .k{font:600 13px var(--body);color:var(--ink);text-align:right}
.row[data-i]{cursor:pointer}.row[data-i]:hover .t,.row[data-i]:focus-visible .t{color:var(--red)}.row[data-i]:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.row .k.none{color:var(--mute);font-weight:400}
.status{font:500 13px var(--mono);color:var(--mute)}
.status.ok{color:#5fd38d}
.status.err{color:#ff8a7a}
.opens{display:grid;gap:16px}
.ctxrow{display:flex;flex-wrap:wrap;gap:8px}
.cx{display:inline-flex;gap:8px;align-items:baseline;background:var(--panel);border:1px solid var(--rule);border-radius:999px;padding:6px 12px;font:500 13px var(--body);color:var(--ink);min-width:0}
.cx i{font:500 10.5px var(--mono);font-style:normal;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.sms{background:#F2F2F7;padding:18px 16px;display:grid;gap:8px}
.smsfrom{font:500 12px var(--body);color:var(--papermute);text-align:center}
.bub{background:#E5E5EA;color:#111;border-radius:18px 18px 18px 4px;padding:10px 14px;font-size:15px;line-height:1.4;max-width:88%}
.why{display:grid;gap:6px;background:var(--panel);border:1px solid var(--rule);border-left:3px solid var(--red);border-radius:6px;padding:14px 16px}
.why p{margin:0;font-size:15px;line-height:1.5;max-width:70ch}
.why p b{color:var(--ink);font-weight:600}
.why .wt{font:800 22px/1 var(--display);font-stretch:75%;text-transform:uppercase;letter-spacing:.01em}
@media (prefers-reduced-motion:no-preference){.why:not([hidden]){animation:whyIn .25s ease}}
@keyframes whyIn{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.bar i,.opt{transition:none}}
</style>

 'competitors':{t:'Borrowed vs. owned',a:'Uses names he already trusts.',b:'Makes Alpha+ its own category.'},
 'churn-first':{t:'Offer vs. listen',a:'Saves fast, but can train people to cancel for a discount.',b:'Fixes the real reason and protects margin.'},
 'churn-last':{t:'Listen vs. offer',a:'Gets data even if he never returns.',b:'Last chance is when a strong offer makes the most sense.'},
 'cta':{t:'Process vs. outcome',a:'Tells him exactly what happens next.',b:'Sells the result.'},
 'emoji':{t:'Emoji vs. plain',a:'Stands out in a crowded inbox.',b:'Looks cleaner and more clinical.'}
};
const OPENS=[
 {id:'other',label:'Words, phrases, claims or brands you find aspirational. Or anything else on your mind.'}
];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let state={step:-1,answers:{},opens:{},name:''};
try{const d=JSON.parse(localStorage.getItem('mmdq')||'null');if(d&&d.answers)state=Object.assign(state,d)}catch(e){}
const save=()=>{try{localStorage.setItem('mmdq',JSON.stringify(state))}catch(e){}};

function spec(type,o){
  if(type==='inbox')return `<div class="spec inbox"><div class="av">MD</div><div style="min-width:0;display:grid;gap:2px"><div class="from">MaleMD <span>9:14 AM</span></div><div class="s">${esc(o.s)}</div><div class="p">${esc(o.p)}</div></div></div>`;
  if(type==='hero')return `<div class="spec hero"><div class="h">${esc(o.h)}</div><div class="sub">${esc(o.sub)}</div><span class="btn">${esc(o.btn)}</span></div>`;
  if(type==='body')return `<div class="spec bodycopy">${o.p.map(x=>`<p>${esc(x)}</p>`).join('')}${o.ul?`<ul>${o.ul.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</div>`;
  if(type==='mail')return `<div class="spec mail${o.plain?' plain':''}"><div class="hd">MaleMD</div><div class="bd">${o.h?`<div class="h">${esc(o.h)}</div>`:''}${o.p.map(x=>x.startsWith('<a>')?`<p><a>${esc(x.slice(3,-4))}</a></p>`:`<p>${esc(x)}</p>`).join('')}${o.btn?`<span class="btn">${esc(o.btn)}</span>`:''}</div></div>`;
  if(type==='sms')return `<div class="spec sms"><div class="smsfrom">MaleMD · Text Message</div><div class="bub">${esc(o.t)}</div></div>`;
  if(type==='cta')return `<div class="spec ctas"><span class="btn">${esc(o.btn)}</span></div>`;
}
function setProg(){
  const n=PAIRS.length,s=state.step;
  document.getElementById('progT').textContent=s<0?'Intro':s>=n?(s===n?'Last questions':'Done'):`${String(s+1).padStart(2,'0')} / ${n}`;
  document.getElementById('progBar').style.width=Math.max(0,Math.min(1,(s+1)/(n+1)))*100+'%';
}
const el=document.getElementById('screen');
function render(){
  setProg();window.scrollTo(0,0);
  const n=PAIRS.length,s=state.step;
  if(s<0)return intro();
  if(s<n)return pair(PAIRS[s]);
  if(s===n)return opens();
  return done();
}
function intro(){
  el.innerHTML=`<div style="display:grid;gap:22px">
   <div class="eyebrow">For ${esc(greet||'the MaleMD team')} · ${PAIRS.length} questions · About 7 minutes</div>
   <h1>How should <em>MaleMD</em> sound?</h1>
   <p class="lede">A quick tone exercise. Your picks help train the AI I write with, so drafts sound like MaleMD from the start.</p>
   <ul class="how">
    <li><b>Pick the one you'd send</b><span>Go with your gut.</span></li>
    <li><b>Both or neither is fine</b><span>Add a note if you want.</span></li>
    <li><b>Some repeat on purpose</b><span>The audience changes the answer.</span></li>
   </ul>
   <label class="nl" for="who" style="max-width:360px">Your name<input type="text" id="who" autocomplete="name" value="${esc(state.name||'')}" placeholder="First name"></label>
   <div class="nav" style="border:0;padding:0"><span></span><button class="go" id="start" ${state.name?'':'disabled'}>${Object.keys(state.answers).length?'Pick up where I left off':'Start'}</button></div></div>`;
  const who=document.getElementById('who'),sb=document.getElementById('start');
  who.oninput=()=>{state.name=who.value.trim();save();sb.disabled=!state.name};
  document.getElementById('start').onclick=()=>{if(!state.name)return;state.step=Object.keys(state.answers).length?Math.min(PAIRS.findIndex(p=>!state.answers[p.id]?.pick)>=0?PAIRS.findIndex(p=>!state.answers[p.id]?.pick):PAIRS.length,PAIRS.length):0;save();render()};
}
function pair(p){
  const a=state.answers[p.id]||{};
  el.innerHTML=`<div style="display:grid;gap:20px">
   <div class="q"><div class="ctxrow"><span class="cx"><i>Audience</i>${esc(p.aud)}</span><span class="cx"><i>Moment</i>${esc(p.moment)}</span><span class="cx"><i>Showing</i>${esc(p.el)}</span></div><h2>${esc(p.q)}</h2></div>
   <div class="pair">
    ${['a','b'].map(k=>`<button class="opt" data-k="${k}" aria-pressed="${a.pick===k}" id="opt-${k}"><div class="lab"><span>Option ${k.toUpperCase()}</span><span class="chk" aria-hidden="true">✓</span></div>${spec(p.type,p[k])}</button>`).join('')}
   </div>
   <div class="alt" role="group" aria-label="Other answers">
    <button class="chip" data-k="both" aria-pressed="${a.pick==='both'}" id="c-both">Both work</button>
    <button class="chip" data-k="neither" aria-pressed="${a.pick==='neither'}" id="c-neither">Neither</button>
   </div>
   <div class="why" id="why" role="status" ${a.pick?'':'hidden'}><span class="eyebrow"><b>The strategy</b></span><div class="wt">${esc(WHY[p.id].t)}</div><p><b>A:</b> ${esc(WHY[p.id].a)}</p><p><b>B:</b> ${esc(WHY[p.id].b)}</p></div>
   <label class="nl" for="note">Note (optional). What you'd change, or why.<textarea id="note" rows="2" placeholder="e.g. A, but less aggressive">${esc(a.note||'')}</textarea></label>
   <div class="nav"><button class="ghost" id="back">← Back</button>${state.submitted?'<button class="ghost" id="tosum">Skip to resubmit</button>':''}<button class="go" id="next" ${a.pick?'':'disabled'}>Next</button></div></div>`;
  if(state.submitted)document.getElementById('tosum').onclick=()=>{state.step=PAIRS.length;save();render()};
  const pick=k=>{state.answers[p.id]=Object.assign(state.answers[p.id]||{},{pick:k});if(state.submitted)state.savedAt='';save();
    el.querySelectorAll('[data-k]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));document.getElementById('next').disabled=false;document.getElementById('why').hidden=false};
  el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>pick(b.dataset.k));
  document.getElementById('note').oninput=e=>{state.answers[p.id]=Object.assign(state.answers[p.id]||{},{note:e.target.value});save()};
  document.getElementById('back').onclick=()=>{state.step--;save();render()};
  document.getElementById('next').onclick=()=>{state.step++;save();if(!state.submitted&&(state.step===12||state.step===PAIRS.length))sync(false);render()};
}
function opens(){
  el.innerHTML=`<div style="display:grid;gap:20px">
   <div class="q"><div class="eyebrow"><b>Last step · optional</b></div><h2>Anything else you want to mention?</h2></div>
   <div class="opens">${OPENS.map(o=>`<label class="nl" for="o-${o.id}">${esc(o.label)}<textarea id="o-${o.id}" rows="6">${esc(state.opens[o.id]||'')}</textarea></label>`).join('')}</div>
   <div class="nav"><button class="ghost" id="back">← Back</button><button class="go" id="submit">Submit</button></div></div>`;
  OPENS.forEach(o=>document.getElementById('o-'+o.id).oninput=e=>{state.opens[o.id]=e.target.value;save()});
  document.getElementById('back').onclick=()=>{state.step--;save();render()};
  document.getElementById('submit').onclick=async()=>{state.step++;const again=!!state.submitted;state.submitted=true;state.submitCount=(state.submitCount||0)+1;state.savedAt='';save();render();await sync(true)};
}
const label=(p,k)=>k==='a'||k==='b'?`${k.toUpperCase()} · ${p[k].trait}`:k==='both'?'Both work':k==='neither'?'Neither':'Skipped';
function resultsText(){
  const L=['MaleMD voice quiz results',''];
  PAIRS.forEach((p,i)=>{const a=state.answers[p.id]||{};L.push(`${i+1}. ${p.ctx}: ${label(p,a.pick)}${a.note?` (note: ${a.note})`:''}`)});
  L.push('');OPENS.forEach(o=>{if(state.opens[o.id])L.push(`${o.label}: ${state.opens[o.id]}`)});
  return L.join('\n');
}
function done(){
  el.innerHTML=`<div style="display:grid;gap:20px">
   <div class="eyebrow"><b>Done</b></div><h1>Thanks${state.name?', <em>'+esc(state.name)+'.</em>':'.'}</h1>
   <p class="lede">Here's what you picked. Tap any answer to change it, then submit again.</p>
   <div class="status${state.savedAt?' ok':''}" id="st" role="status">${state.savedAt?'Saved. Kaylyn has your answers.':'Saving…'}</div><button class="ghost" id="retry" hidden>Try saving again</button>
   <div class="sum">${PAIRS.map((p,i)=>{const a=state.answers[p.id]||{};return `<div class="row" data-i="${i}" role="button" tabindex="0" title="Change this answer"><span class="n">${String(i+1).padStart(2,'0')}</span><span class="t">${esc(p.ctx)}${a.note?`<small>${esc(a.note)}</small>`:''}</span><span class="k${a.pick?'':' none'}">${esc(label(p,a.pick))}</span></div>`}).join('')}</div>
   <div class="nav"><button class="ghost" id="edit">← Start over from question 1</button><button class="go" id="copy">Copy my answers</button></div>
   <p class="foot" id="cpst"></p></div>`;
  document.getElementById('edit').onclick=()=>{state.step=0;save();render()};
  document.getElementById('retry').onclick=()=>{document.getElementById('st').textContent='Saving…';document.getElementById('st').className='status';sync(true)};
  el.querySelectorAll('.row[data-i]').forEach(r=>{const go=()=>{state.step=+r.dataset.i;save();render()};r.onclick=go;r.onkeydown=e=>{if(e.key==='Enter')go()}});
  document.getElementById('copy').onclick=async()=>{const t=resultsText(),c=document.getElementById('cpst');
    try{await navigator.clipboard.writeText(t);c.textContent='Copied. Paste it into a reply to Kaylyn if you like.'}catch(e){c.textContent='Copy was blocked here. Select the list above and copy it instead.'}};
}
const FORM='https://docs.google.com/forms/d/e/1FAIpQLSfRgWLusT5iSDwOk7I9XHID5Nb1-JPeqoyFjYww2Nw0zLpu-Q/formResponse';
const F={session:'entry.1596762017',status:'entry.1578207017',answers:'entry.1037937472',other:'entry.1121538626',raw:'entry.471080508'};
let greet='';try{greet=(new URLSearchParams(location.search).get('n')||'').slice(0,40)}catch(e){}
if(!state.sid){state.sid='R-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6);save()}
let lastSent='';
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&Object.keys(state.answers).length&&!(state.submitted&&state.savedAt))sync(false,true)});
async function sync(final,leaving){
  const st=document.getElementById('st');
  const done=PAIRS.filter(p=>state.answers[p.id]?.pick).length;
  const body=new URLSearchParams();
  body.set(F.session,`${state.name||'(no name)'} · ${state.sid}`);
  body.set(F.status,final?(state.submitCount>1?`Resubmitted #${state.submitCount} (${done}/${PAIRS.length})`:`Submitted (${done}/${PAIRS.length})`):state.submitted?`Edited after submit, not resubmitted (${done}/${PAIRS.length})`:`In progress (${done}/${PAIRS.length})`);
  body.set(F.answers,resultsText());
  body.set(F.other,state.opens.other||'');
  body.set(F.raw,JSON.stringify({name:state.name,sid:state.sid,submitCount:state.submitCount||0,answers:state.answers,opens:state.opens,submitted:!!final,at:new Date().toISOString()}));
  const sig=body.get(F.raw).replace(/"at":"[^"]*"/,'');
  if(sig===lastSent&&!final)return;
  try{
    await fetch(FORM,{method:'POST',mode:'no-cors',body,keepalive:!!leaving});
    lastSent=sig;if(final){state.savedAt=new Date().toISOString();save()}
    if(st){st.textContent='Saved. Kaylyn has your answers.';st.className='status ok';const rb=document.getElementById('retry');if(rb)rb.hidden=true}
  }catch(e){
    if(final){state.savedAt='';save()}
    if(st){st.textContent='Couldn\'t save. Check your connection and try again, or use "Copy my answers" and email them to Kaylyn.';st.className='status err';const rb=document.getElementById('retry');if(rb)rb.hidden=false}
  }
}
render();
</script>

</body></html>
